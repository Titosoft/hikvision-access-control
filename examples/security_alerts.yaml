# Substitua as entidades e notify.mobile_app_seu_celular pelos seus identificadores.
# Este arquivo contém uma lista para automations.yaml; no editor YAML de uma
# automação, copie apenas o conteúdo do item desejado, sem o hífen inicial.
- id: hikvision_alertar_violacao_facial
  alias: Alertar violação da facial
  triggers:
    - trigger: state
      entity_id: event.portao_social_evento_de_acesso
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.to_state is not none and
           trigger.to_state.attributes.get('event_code') in [
             'device_tamper_alarm',
             'card_reader_tamper_alarm',
             'security_module_tamper_alarm',
             'camera_tamper_alarm'
           ] }}
  actions:
    - action: notify.mobile_app_seu_celular
      data:
        title: Alerta de segurança na facial
        message: >-
          {% set code = trigger.to_state.attributes.get('event_code') %}
          {% if code == 'camera_tamper_alarm' %}
            Detectada violação por cobertura ou obstrução da câmera da facial.
          {% elif code == 'security_module_tamper_alarm' %}
            Detectada violação física do módulo seguro de controle da porta.
          {% elif code == 'card_reader_tamper_alarm' %}
            Detectada violação física do leitor de cartão.
          {% else %}
            Detectada violação física do terminal facial.
          {% endif %}
  mode: queued

- id: hikvision_alertar_perda_conexao_facial
  alias: Alertar perda de conexão da facial
  triggers:
    - trigger: state
      entity_id: sensor.portao_social_conexao_isapi
      to: "offline"
      for: "00:00:30"
  actions:
    - action: notify.mobile_app_seu_celular
      data:
        title: Alerta de segurança na facial
        message: >-
          A conexão ISAPI da facial está offline há 30 segundos.
          Possível corte de cabo, falta de energia ou falha de comunicação.
  mode: single
