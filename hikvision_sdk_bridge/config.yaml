name: Hikvision SDK Bridge
version: "0.1.2"
slug: hikvision_sdk_bridge
description: Receives Hikvision HCNetSDK intercom callbacks without polling
url: https://github.com/Titosoft/hikvision-access-control
image: ghcr.io/titosoft/hikvision-sdk-bridge
stage: experimental
startup: services
boot: auto
init: false
homeassistant_api: true
arch:
  - amd64
  - aarch64
options:
  device_host: 192.168.1.100
  device_port: 8000
  username: admin
  password: ""
schema:
  device_host: str
  device_port: port
  username: str
  password: password
  # Accepted only so upgrades with the former option keep validating; ignored.
  sdk_library: str?
