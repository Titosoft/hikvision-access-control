name: Hikvision SDK Bridge
version: "0.1.0"
slug: hikvision_sdk_bridge
description: Receives Hikvision HCNetSDK intercom callbacks without polling
url: https://github.com/Titosoft/hikvision-access-control
stage: experimental
startup: services
boot: auto
init: false
homeassistant_api: true
arch:
  - amd64
  - aarch64
  - armv7
map:
  - share:ro
options:
  device_host: 192.168.1.100
  device_port: 8000
  username: admin
  password: ""
  sdk_library: /share/hikvision_sdk/lib/libhcnetsdk.so
schema:
  device_host: str
  device_port: port
  username: str
  password: password
  sdk_library: str
