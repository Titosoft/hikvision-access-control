name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Validate JSON
        run: python -m json.tool hacs.json >/dev/null && find custom_components -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Lint Python
        run: ruff check custom_components tests
      - name: Run tests
        run: python -m pytest
